# Production compose for Haij, designed to be run by Coolify on an EU VPS.
# See docs/deploy.md. All secrets come from the environment (Coolify UI);
# nothing here has a real default.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: haij
      HAIJ_APP_PASSWORD: ${HAIJ_APP_PASSWORD:?set HAIJ_APP_PASSWORD}
      HAIJ_AUTH_PASSWORD: ${HAIJ_AUTH_PASSWORD:?set HAIJ_AUTH_PASSWORD}
    volumes:
      - haij-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haij"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?}@db:5432/haij
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgres://haij_app:${HAIJ_APP_PASSWORD:?}@db:5432/haij
      AUTH_DATABASE_URL: postgres://haij_auth:${HAIJ_AUTH_PASSWORD:?}@db:5432/haij
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL, e.g. https://app.haij.dk}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  haij-pgdata:
